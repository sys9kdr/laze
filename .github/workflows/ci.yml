name: ci

on:
  # Branch pushes are tested by their pull request; only main needs a
  # post-merge run. This avoids the duplicate push+PR runs per commit.
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the previous run instead of queueing
# it, so checks start (and finish) as early as possible.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The integration suite spawns nvim/git sessions; without a bound a
    # broken spawn hangs until GitHub's 6h job limit.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # laze requires nvim 0.12+ (vim.pack). nightly catches API drift.
        nvim: [v0.12.0, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # GitHub's ubuntu image does not ship luajit (exit 127 otherwise).
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Unit tests (luajit, no nvim needed)
        run: |
          luajit tests/test_compile.lua
          luajit tests/test_subset.lua

      - name: Integration tests (incl. spawned-session startup phases)
        run: nvim --cmd "set rtp+=." -l tests/run.lua
